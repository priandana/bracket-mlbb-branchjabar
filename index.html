<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Bracket turnamen Mobile Legends real-time." />
  <title>ML Tournament Bracket</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="header-left">
      <a href="index.html" class="header-logo">
        <div class="logo-icon">⚔️</div>
        <span class="logo-name">ML Bracket</span>
      </a>
      <span class="logo-sep">|</span>
      <span class="tournament-name" id="tournament-name">Memuat...</span>
    </div>
    <div class="header-right">
      <div class="header-badge">
        <span class="dot"></span> Live
      </div>
      <a href="admin.html" class="btn btn-secondary btn-sm">⚙️ Admin</a>
    </div>
  </header>

  <!-- Bracket -->
  <main class="bracket-outer">
    <div class="loading-state" id="loading-state">
      <div class="loading-ring"></div>
      <div class="loading-text">Memuat bracket...</div>
    </div>
    <div id="bracket-root" style="position:relative;"></div>
  </main>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/bracket.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => { document.getElementById('loading-state').style.display = 'none'; }, 1500);
    });
  </script>
  <script src="js/app.js"></script>
</body>
</html>
