<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Bracket turnamen Mobile Legends real-time." />
  <title>ML Tournament Bracket</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="header-left">
      <a href="index.html" class="header-logo">
        <div class="logo-icon">⚔️</div>
        <span class="logo-name">ML Bracket</span>
      </a>
      <span class="logo-sep">|</span>
      <span class="tournament-name" id="tournament-name">Memuat...</span>
    </div>
    <div class="header-right">
      <div class="header-badge">
        <span class="dot"></span> Live
      </div>
      <!-- Admin button removed from public view -->
    </div>
  </header>

  <!-- Zoom Controls Toolbar -->
  <div class="zoom-toolbar">
    <button class="zoom-btn" id="zoom-in-btn" title="Zoom In">+</button>
    <span class="zoom-level-text" id="zoom-level-text">100%</span>
    <button class="zoom-btn" id="zoom-out-btn" title="Zoom Out">−</button>
    <button class="zoom-btn reset" id="zoom-reset-btn" title="Reset Zoom">🔄 Fit</button>
  </div>

  <!-- Bracket Area -->
  <main class="bracket-outer" id="bracket-outer">
    <div class="loading-state" id="loading-state">
      <div class="loading-ring"></div>
      <div class="loading-text">Memuat bracket...</div>
    </div>
    <div id="bracket-root" style="position:relative;"></div>
  </main>

  <!-- Epic Detail Match Modal (For Viewers) -->
  <div class="modal-overlay" id="viewer-match-modal" role="dialog" aria-modal="true">
    <div class="modal epic-modal">
      <div class="modal-head">
        <div>
          <div class="modal-title" id="vm-title">Detail Pertandingan</div>
          <div class="modal-sub">Format: <span id="vm-format" style="color:var(--cyan);font-weight:700">BO1</span></div>
        </div>
        <button class="modal-close" id="vm-close-btn" aria-label="Tutup">✕</button>
      </div>
      <div id="vm-body"></div>
    </div>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/bracket.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => { document.getElementById('loading-state').style.display = 'none'; }, 1500);
    });
  </script>
  <script src="js/app.js"></script>
</body>
</html>
