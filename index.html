<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Bracket turnamen Mobile Legends real-time. Ikuti perkembangan pertandingan secara langsung." />
  <title>ML Tournament Bracket</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Background FX -->
  <div class="bg-fx" aria-hidden="true">
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
  </div>

  <!-- Header -->
  <header class="site-header">
    <div class="logo-text">⚔️ ML Tournament</div>
    <div class="tagline">Live Bracket · Real-Time</div>
    <div class="tournament-name" id="tournament-name">Memuat...</div>
    <div class="header-decorline"></div>
  </header>

  <!-- Bracket Viewer -->
  <main class="bracket-outer">
    <!-- Loading state (shown initially) -->
    <div class="loading-state" id="loading-state">
      <div class="loading-ring"></div>
      <div class="loading-text">Memuat Bracket...</div>
    </div>

    <!-- Bracket root (populated by app.js) -->
    <div id="bracket-root" style="position:relative;"></div>
  </main>

  <!-- Float admin link -->
  <a href="admin.html" class="float-admin-btn" title="Admin Panel">⚙️ Admin</a>

  <!-- Firebase SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>

  <!-- App Scripts -->
  <script src="js/firebase-config.js"></script>
  <script src="js/bracket.js"></script>
  <script>
    // Hide loading once data starts flowing
    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        document.getElementById('loading-state').style.display = 'none';
      }, 1800);
    });
  </script>
  <script src="js/app.js"></script>

</body>
</html>
